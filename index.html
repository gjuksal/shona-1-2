<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>［쇼나］ 결혼전야 ［すべて］</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f6;color:#222;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:30px auto;padding:0 16px}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px}
h1{font-size:22px;margin:0 0 6px}
#status{color:#666;margin:10px 0 16px}
#log{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-start}
.avatar{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#eee;flex:none}
.bubble{background:#f1f1f3;border-radius:12px;padding:9px 12px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.name{font-weight:700;font-size:13px;margin-bottom:3px}
.time{font-size:10px;color:#999;margin-top:4px}
.system{color:#888;font-size:12px;padding:8px 0}
#more{margin-top:16px;padding:10px 16px;border:0;border-radius:9px;cursor:pointer}
</style>
</head>
<body>
<main><div class="card">
<h1>［쇼나］ 결혼전야 ［すべて］</h1>
<div id="status">파일을 불러오는 중…</div>
<div id="log"></div>
<button id="more" style="display:none">더 보기</button>
</div></main>
<script>
const $=id=>document.getElementById(id);
const statusEl=$('status'), log=$('log'), more=$('more');
let lines=[], images={}, shown=0;
const PAGE=100;

async function getJSON(path){
  const r=await fetch(path,{cache:'no-cache'});
  if(!r.ok) throw new Error(path+' ('+r.status+')');
  return r.json();
}

function imageSrc(v){
  if(!v) return '';
  if(typeof v==='string') return v.startsWith('data:')?v:'';
  if(typeof v==='object'){
    if(typeof v.src==='string') return v.src;
    if(typeof v.url==='string') return v.url;
    if(typeof v.data==='string'){
      if(v.data.startsWith('data:')) return v.data;
      const mime=v.mimeType||v.type||'image/jpeg';
      return 'data:'+mime+';base64,'+v.data;
    }
    if(typeof v.base64==='string'){
      const mime=v.mimeType||v.type||'image/jpeg';
      return 'data:'+mime+';base64,'+v.base64;
    }
  }
  return '';
}

function draw(){
  const end=Math.min(shown+PAGE,lines.length);
  for(let i=shown;i<end;i++){
    const x=lines[i];
    if(x.hidden) continue;
    if(x.channel==='other') continue;

    if(x.kind!=='dialogue'){
      const s=document.createElement('div');
      s.className='system';
      s.textContent=x.text||'';
      log.appendChild(s);
      continue;
    }

    const row=document.createElement('div');
    row.className='msg';

    const src=imageSrc(images[x.imageId]);
    if(src){
      const img=document.createElement('img');
      img.className='avatar';
      img.loading='lazy';
      img.src=src;
      row.appendChild(img);
    }

    const b=document.createElement('div');
    b.className='bubble';

    const n=document.createElement('div');
    n.className='name';
    n.textContent=x.speaker?.name||'';
    if(x.speaker?.color) n.style.color=x.speaker.color;

    const t=document.createElement('div');
    t.textContent=x.text||'';

    b.appendChild(n);
    b.appendChild(t);

    if(x.timestamp){
      const tm=document.createElement('div');
      tm.className='time';
      tm.textContent=new Date(x.timestamp).toLocaleString('ko-KR');
      b.appendChild(tm);
    }
    row.appendChild(b);
    log.appendChild(row);
  }
  shown=end;
  more.style.display=shown<lines.length?'block':'none';
}

async function load(){
  try{
    const m=await getJSON('manifest.json');

    // 이미지가 실패해도 로그 자체는 계속 표시
    const chunks=m.imageChunks||[];
    const results=await Promise.allSettled(chunks.map(getJSON));
    for(const r of results){
      if(r.status==='fulfilled' && r.value && typeof r.value==='object')
        images=Object.assign(images,r.value);
    }

    lines=m.metadata?.lines||[];
    statusEl.textContent=`불러오기 완료 · ${lines.length.toLocaleString()}개 로그 · 이미지 ${Object.keys(images).length}개`;
    draw();
  }catch(e){
    statusEl.textContent='불러오기에 실패했습니다: '+e.message;
  }
}
more.onclick=draw;
load();
</script>
</body>
</html>
